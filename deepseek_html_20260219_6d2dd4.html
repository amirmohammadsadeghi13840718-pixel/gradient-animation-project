<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه گرادینت متحرک</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- پس زمینه متحرک -->
    <div class="gradient-bg">
        <div class="gradient-1"></div>
        <div class="gradient-2"></div>
        <div class="gradient-3"></div>
    </div>

    <!-- محتوای اصلی -->
    <div class="container">
        <!-- لوگو (داده URL) -->
        <div class="logo-container">
            <img src="https://via.placeholder.com/150x150/000000/ffffff?text=LOGO" 
                 alt="لوگو" 
                 class="logo"
                 id="animatedLogo">
        </div>

        <!-- متن با افکت نئونی و متحرک -->
        <h1 class="neon-text" id="animatedText">
            <span class="letter">پ</span>
            <span class="letter">ر</span>
            <span class="letter">و</span>
            <span class="letter">ژ</span>
            <span class="letter">ه</span>
            <span class="letter"> </span>
            <span class="letter">ج</span>
            <span class="letter">ذ</span>
            <span class="letter">ا</span>
            <span class="letter">ب</span>
        </h1>

        <!-- زیرنویس -->
        <p class="subtitle" id="animatedSubtitle">
            با افکت‌های گرادینت متحرک و نئون
        </p>
    </div>

    <script src="main.js"></script>
</body>
</html>
